<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Virtual de Máquinas Eléctricas - Diseñador de Conexiones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    /* Fondo cuadriculado tipo CAD / Tinkercad */
    .lab-grid {
      background-color: #f1f5f9;
      background-size: 25px 25px, 25px 25px, 100px 100px, 100px 100px;
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.6) 1px, transparent 1px),
        linear-gradient(to right, rgba(148, 163, 184, 0.45) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.45) 1.5px, transparent 1.5px);
    }

    /* Temas de Fondo del Lienzo */
    .theme-dark {
      background-color: #0b1120 !important;
      background-size: 30px 30px, 30px 30px, 120px 120px, 120px 120px !important;
      background-image: 
        linear-gradient(to right, rgba(51, 65, 85, 0.4) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.4) 1px, transparent 1px),
        linear-gradient(to right, rgba(71, 85, 105, 0.6) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(71, 85, 105, 0.6) 1.5px, transparent 1.5px) !important;
    }
    .theme-white {
      background-color: #ffffff !important;
      background-image: none !important;
    }

    /* Animación fluida de la barra lateral */
    #sidebar {
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar.collapsed {
      width: 0px !important;
      min-width: 0px !important;
      overflow: hidden;
      transform: translateX(-100%);
      border-right: none;
    }

    /* Estilo del Borne Banana Hembra */
    .banana-jack {
      position: absolute;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 2.5px solid #0f172a;
      transform: translate(-50%, -50%);
      cursor: crosshair;
      z-index: 30;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 1.5px 3px rgba(0,0,0,0.55);
    }
    .banana-jack:hover {
      transform: translate(-50%, -50%) scale(1.42);
      box-shadow: 0 0 12px 4px rgba(250, 204, 21, 0.95);
      border-color: #fef08a;
    }
    .banana-jack::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #020617;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* Módulo en el banco */
    .lab-machine {
      position: absolute;
      cursor: grab;
      border-radius: 6px;
      z-index: 10;
      box-shadow: 0 12px 26px -4px rgba(15, 23, 42, 0.45);
      transition: outline 0.1s ease;
    }
    .lab-machine:active {
      cursor: grabbing;
    }
    .lab-machine.active-selected {
      outline: 3px dashed #f59e0b;
      outline-offset: 4px;
    }

    /* En modo Mover Tablero, las máquinas no interceptan el arrastre */
    body.pan-mode-active .lab-machine,
    body.pan-mode-active .banana-jack,
    body.pan-mode-active .wire-handle {
      pointer-events: none !important;
    }
    body.pan-mode-active #viewport {
      cursor: grab !important;
    }
    body.pan-mode-active #viewport:active {
      cursor: grabbing !important;
    }

    /* Manejador de cable (Waypoint para rodar curvas) */
    .wire-handle {
      fill: #ffffff;
      stroke: #0f172a;
      stroke-width: 2.5;
      cursor: grab;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      transition: r 0.15s ease, stroke-color 0.15s ease;
    }
    .wire-handle:hover {
      r: 9.5;
      stroke: #f59e0b;
      stroke-width: 3.5;
    }
    .wire-handle:active {
      cursor: grabbing;
      fill: #fef08a;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- ================= BARRA SUPERIOR DE HERRAMIENTAS ================= -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex flex-wrap items-center justify-between gap-2 shadow-lg z-30">
    <div class="flex items-center gap-2">
      <!-- Botón para Colapsar/Mostrar Barra Lateral -->
      <button id="btnToggleSidebar" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 shadow transition-all active:scale-95" title="Mostrar u ocultar el Banco de Máquinas">
        <i id="toggleSidebarIcon" class="fa-solid fa-angles-left text-xs"></i>
        <span id="toggleSidebarText" class="text-xs uppercase tracking-wider font-black">Ocultar Banco</span>
      </button>

      <!-- Selector de Modo: Interactuar vs Mover Tablero Libremente -->
      <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800">
        <button id="btnModeInteract" class="px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950 flex items-center gap-1.5 transition" title="Conectar bornes, mover máquinas o arrastrar fondo vacío">
          <i class="fa-solid fa-arrow-pointer"></i>
          <span>Interactuar</span>
        </button>
        <button id="btnModePan" class="px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1.5 transition" title="Modo Mano: Arrastra cualquier parte de la pantalla para moverte por el tablero">
          <i class="fa-solid fa-hand"></i>
          <span>Mover Tablero</span>
        </button>
      </div>
    </div>

    <!-- Selector de Color de Cables -->
    <div class="flex items-center gap-1.5 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 shadow-inner">
      <span class="text-xs text-slate-400 font-semibold mr-1 flex items-center gap-1">
        <i class="fa-solid fa-palette text-amber-400"></i> Cable:
      </span>
      <button class="color-btn w-5 h-5 rounded-full bg-red-600 border-2 border-white ring-2 ring-red-500 transition-transform active:scale-90" data-color="#dc2626" title="Fase L1 / Positivo (Rojo)"></button>
      <button class="color-btn w-5 h-5 rounded-full bg-amber-400 border-2 border-transparent hover:border-white transition-transform active:scale-90" data-color="#f59e0b" title="Fase L2 (Amarillo)"></button>
      <button class="color-btn w-5 h-5 rounded-full bg-blue-600 border-2 border-transparent hover:border-white transition-transform active:scale-90" data-color="#2563eb" title="Fase L3 / Neutro (Azul)"></button>
      <button class="color-btn w-5 h-5 rounded-full bg-slate-900 border-2 border-slate-500 hover:border-white transition-transform active:scale-90" data-color="#0f172a" title="Retorno / Negativo (Negro)"></button>
      <button class="color-btn w-5 h-5 rounded-full bg-emerald-600 border-2 border-transparent hover:border-white transition-transform active:scale-90" data-color="#16a34a" title="Tierra PE (Verde)"></button>
      <button class="color-btn w-5 h-5 rounded-full bg-cyan-400 border-2 border-transparent hover:border-white transition-transform active:scale-90" data-color="#06b6d4" title="Control (Cian)"></button>
      <button class="color-btn w-5 h-5 rounded-full bg-purple-500 border-2 border-transparent hover:border-white transition-transform active:scale-90" data-color="#9333ea" title="Auxiliar (Violeta)"></button>
    </div>

    <!-- Selector de Forma de Cable: Curvo vs Cuadrado (Ortogonal 90°) -->
    <div class="flex items-center bg-slate-950 p-1 rounded-lg border border-slate-800 gap-1">
      <button id="btnStyleCurved" class="px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950 flex items-center gap-1 transition" title="Cable Curvo (Arrastra el nodo blanco para arquear)">
        <span>〰️</span>
        <span>Curvo</span>
      </button>
      <button id="btnStyleOrtho" class="px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 transition" title="Cable Cuadrado a 90° (Doble clic en el cable o clic aquí para girar esquinas)">
        <span>📐</span>
        <span>Cuadrado</span>
      </button>
    </div>

    <!-- Selector de Fondo del Lienzo y Controles de Zoom -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800 text-xs">
        <button class="theme-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-amber-300" data-theme="dark" title="Fondo Oscuro de Alto Contraste">Oscuro</button>
        <button class="theme-btn px-2 py-0.5 rounded text-[11px] font-semibold text-slate-400 hover:text-white" data-theme="grid" title="Rejilla Clara CAD">Rejilla</button>
        <button class="theme-btn px-2 py-0.5 rounded text-[11px] font-semibold text-slate-400 hover:text-white" data-theme="white" title="Blanco Liso para Informes">Blanco</button>
      </div>

      <div class="flex items-center gap-1 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800 text-xs">
        <button id="btnZoomOut" class="px-1.5 py-0.5 hover:text-amber-400 font-bold" title="Alejar zoom"><i class="fa-solid fa-minus"></i></button>
        <span id="zoomLabel" class="text-[11px] font-mono px-1 min-w-[42px] text-center">90%</span>
        <button id="btnZoomIn" class="px-1.5 py-0.5 hover:text-amber-400 font-bold" title="Acercar zoom"><i class="fa-solid fa-plus"></i></button>
        <button id="btnZoomReset" class="ml-1 text-[10px] text-amber-300 hover:text-white px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded font-semibold" title="Centrar y encuadrar vista">Centrar</button>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center gap-1.5">
      <button id="btnDeleteSelected" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-rose-600 text-rose-300 hover:text-white rounded border border-rose-900/60 flex items-center gap-1 transition" title="Eliminar máquina o cable seleccionado (Supr)">
        <i class="fa-solid fa-trash-can"></i>
        <span>Eliminar</span>
      </button>

      <button id="btnClearWires" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-amber-600 text-amber-300 hover:text-white rounded border border-amber-900/60 flex items-center gap-1 transition" title="Quitar todos los cables del tablero">
        <i class="fa-solid fa-scissors"></i>
        <span>Quitar Cables</span>
      </button>

      <button id="btnClearAll" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-rose-700 text-slate-200 hover:text-white rounded border border-slate-700 flex items-center gap-1 transition" title="Vaciar todas las máquinas y cables del tablero">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Limpiar Tablero</span>
      </button>

      <button id="btnExport" class="px-3 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded shadow flex items-center gap-1.5 transition">
        <i class="fa-solid fa-camera"></i>
        <span>Exportar PNG</span>
      </button>
    </div>
  </header>

  <!-- ================= CUERPO CENTRAL ================= -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- BOTÓN FLOTANTE PARA EXPANDIR LA BARRA LATERAL SI ESTÁ OCULTA -->
    <button id="btnFloatingOpen" class="hidden absolute top-3 left-3 z-40 bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-2 rounded-xl font-bold shadow-2xl flex items-center gap-2 transition active:scale-95 border-2 border-slate-900">
      <i class="fa-solid fa-boxes-stacked text-sm"></i>
      <span class="text-xs uppercase tracking-wider font-black">Abrir Banco (16)</span>
    </button>

    <!-- PANEL LATERAL IZQUIERDO: BANCO DE MÁQUINAS -->
    <aside id="sidebar" class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-20 shadow-2xl shrink-0">
      <div class="p-3 border-b border-slate-800 bg-slate-950/60 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-amber-400"></i> Banco de Máquinas
        </span>
        <div class="flex items-center gap-2">
          <span class="text-[10px] bg-slate-800 text-amber-400 font-bold px-2 py-0.5 rounded">16 Equipos</span>
          <button id="btnSidebarClose" class="text-slate-400 hover:text-white p-1 hover:bg-slate-800 rounded" title="Ocultar banco">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Buscador rápido -->
      <div class="p-2.5 border-b border-slate-800/80 bg-slate-900">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass text-slate-500 absolute left-2.5 top-2.5 text-xs"></i>
          <input type="text" id="searchInput" placeholder="Buscar DL 1080, vatímetro, RLC..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
        </div>
      </div>

      <!-- Lista con scrollbar -->
      <div class="flex-1 overflow-y-auto p-2.5 space-y-2" id="machinesCatalog"></div>

      <!-- Texto corto inferior -->
      <div class="p-2.5 bg-slate-950/90 border-t border-slate-800 text-[11px] text-slate-400 space-y-1">
        <p>Simulador del laboratorio de máquinas eléctricas.</p>
      </div>
    </aside>

    <!-- ÁREA DE DIBUJO / LIENZO CAD -->
    <main class="flex-1 relative overflow-hidden lab-grid theme-dark" id="viewport" style="cursor: grab;">
      <!-- Contenedor transformable por Zoom y Pan -->
      <div id="world" class="absolute origin-top-left" style="width: 6000px; height: 6000px;">
        <!-- Capa SVG para cables -->
        <svg id="wiresSvgLayer" class="absolute inset-0 w-full h-full pointer-events-none z-10 overflow-visible"></svg>
        <!-- Capa HTML para máquinas -->
        <div id="machinesBoard" class="absolute inset-0 z-0"></div>
      </div>

      <!-- CONTROLES FLOTANTES DE NAVEGACIÓN (D-PAD PARA MOVERSE EN GRANDE O PEQUEÑO) -->
      <div class="absolute bottom-4 right-4 z-30 bg-slate-900/95 border border-slate-700/80 p-2 rounded-2xl shadow-2xl flex flex-col items-center gap-1 backdrop-blur">
        <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400">Mover Tablero</span>
        <button id="panUp" class="w-8 h-7 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 rounded-lg text-xs font-bold transition flex items-center justify-center" title="Mover vista hacia arriba">
          <i class="fa-solid fa-chevron-up"></i>
        </button>
        <div class="flex items-center gap-1">
          <button id="panLeft" class="w-8 h-7 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 rounded-lg text-xs font-bold transition flex items-center justify-center" title="Mover vista a la izquierda">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button id="panCenter" class="w-8 h-7 bg-amber-500/20 hover:bg-amber-500 hover:text-slate-950 text-amber-300 rounded-lg text-xs font-bold transition flex items-center justify-center" title="Centrar todo el circuito">
            <i class="fa-solid fa-crosshairs"></i>
          </button>
          <button id="panRight" class="w-8 h-7 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 rounded-lg text-xs font-bold transition flex items-center justify-center" title="Mover vista a la derecha">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
        <button id="panDown" class="w-8 h-7 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 rounded-lg text-xs font-bold transition flex items-center justify-center" title="Mover vista hacia abajo">
          <i class="fa-solid fa-chevron-down"></i>
        </button>
      </div>

      <!-- Aviso inicial si la mesa está vacía -->
      <div id="emptyNotice" class="hidden absolute inset-0 flex flex-col items-center justify-center text-slate-400 pointer-events-none">
        <div class="bg-slate-900/95 backdrop-blur p-6 rounded-2xl border border-slate-700 shadow-2xl max-w-md text-center">
          <i class="fa-solid fa-bolt text-4xl text-amber-400 mb-2"></i>
          <h3 class="text-base font-bold text-white mb-1">Mesa de Conexiones Lista</h3>
          <p class="text-xs text-slate-300">Selecciona cualquier máquina en el banco izquierdo para agregarla al tablero.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast informativo -->
  <div id="toast" class="fixed bottom-4 left-4 bg-slate-900/95 text-white px-3.5 py-2 rounded-xl shadow-2xl border border-slate-700 text-xs flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
    <i class="fa-solid fa-circle-info text-amber-400"></i>
    <span id="toastMsg">Listo</span>
  </div>

  <!-- ================= LÓGICA Y DEFINICIÓN DE LAS 15 MÁQUINAS ================= -->
  <script>
    const MACHINE_TEMPLATES = [
      // 1. TRANSFORMADOR TRIFÁSICO DE LORENZO DL 1080 (EXACTO A LA FOTO SUBIDA: 2x190V/2x70V, 1kVA, 25 BORNES)
      {
        id: 'dl1080_tri',
        name: 'Transformador Trifásico De Lorenzo DL 1080 (1kVA)',
        category: 'Transformadores • 25 bornes (2x190V / 2x70V)',
        width: 470,
        height: 380,
        terminals: [
          // COLUMNA U (Izquierda) - Devanado Superior
          { id: '1u1', label: '1U1', x: 68,  y: 105, color: '#0f172a' },
          { id: '1u2', label: '1U2', x: 68,  y: 170, color: '#0f172a' },
          { id: '2u1', label: '2U1', x: 132, y: 105, color: '#0f172a' },
          { id: '2u2', label: '2U2', x: 132, y: 170, color: '#0f172a' },
          // COLUMNA U (Izquierda) - Devanado Inferior
          { id: '1u3', label: '1U3', x: 68,  y: 235, color: '#0f172a' },
          { id: '1u4', label: '1U4', x: 68,  y: 300, color: '#0f172a' },
          { id: '2u3', label: '2U3', x: 132, y: 235, color: '#0f172a' },
          { id: '2u4', label: '2U4', x: 132, y: 300, color: '#0f172a' },

          // COLUMNA V (Centro) - Devanado Superior (n1=552, n2=213)
          { id: '1v1', label: '1V1', x: 205, y: 105, color: '#0f172a' },
          { id: '1v2', label: '1V2', x: 205, y: 170, color: '#0f172a' },
          { id: '2v1', label: '2V1', x: 269, y: 105, color: '#0f172a' },
          { id: '2v2', label: '2V2', x: 269, y: 170, color: '#0f172a' },
          // COLUMNA V (Centro) - Devanado Inferior (n1=552, n2=213)
          { id: '1v3', label: '1V3', x: 205, y: 235, color: '#0f172a' },
          { id: '1v4', label: '1V4', x: 205, y: 300, color: '#0f172a' },
          { id: '2v3', label: '2V3', x: 269, y: 235, color: '#0f172a' },
          { id: '2v4', label: '2V4', x: 269, y: 300, color: '#0f172a' },

          // COLUMNA W (Derecha) - Devanado Superior
          { id: '1w1', label: '1W1', x: 342, y: 105, color: '#0f172a' },
          { id: '1w2', label: '1W2', x: 342, y: 170, color: '#0f172a' },
          { id: '2w1', label: '2W1', x: 406, y: 105, color: '#0f172a' },
          { id: '2w2', label: '2W2', x: 406, y: 170, color: '#0f172a' },
          // COLUMNA W (Derecha) - Devanado Inferior
          { id: '1w3', label: '1W3', x: 342, y: 235, color: '#0f172a' },
          { id: '1w4', label: '1W4', x: 342, y: 300, color: '#0f172a' },
          { id: '2w3', label: '2W3', x: 406, y: 235, color: '#0f172a' },
          { id: '2w4', label: '2W4', x: 406, y: 300, color: '#0f172a' },

          // Borne de Tierra PE
          { id: 'pe',  label: 'PE (Tierra)', x: 406, y: 348, color: '#16a34a' }
        ],
        svgContent: `
          <!-- Chasis amarillo mostaza exacto al DL 1080 de la foto -->
          <rect width="100%" height="100%" rx="6" fill="#dec031" stroke="#423606" stroke-width="3.5"/>
          
          <!-- 4 Tornillos de sujeción en las esquinas -->
          <circle cx="12" cy="52" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
          <circle cx="458" cy="52" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
          <circle cx="12" cy="335" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
          <circle cx="458" cy="335" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

          <!-- Logotipo DL esquina superior izquierda -->
          <g transform="translate(20, 12)">
            <path d="M 0 0 L 22 0 L 22 26 L 0 26 Z" fill="none" stroke="#475569" stroke-width="3.5"/>
            <path d="M 12 6 L 34 6 L 34 26 L 12 26" fill="none" stroke="#475569" stroke-width="3.5"/>
            <text x="0" y="36" font-size="6.5" font-weight="900" fill="#1e293b" letter-spacing="0.5">DE LORENZO</text>
          </g>

          <!-- Encabezado derecho: DL 1080 / 3-PH TRANSFORMER -->
          <text x="452" y="24" font-size="13" font-weight="900" fill="#1e293b" text-anchor="end">DL 1080</text>
          <text x="452" y="35" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="end">3-PH TRANSFORMER</text>

          <!-- ================= COLUMNA U (1U1..2U4) ================= -->
          <!-- Superior U -->
          <polyline points="68,105 95,105 95,170 68,170" fill="none" stroke="#334155" stroke-width="2"/>

    /* ============================================================

    const appState = {
      currentColor: '#dc2626',
      currentWireStyle: 'curved', // 'curved' | 'ortho'
      machinesOnBoard: [],
      wires: [],
      selectedWireId: null,
      selectedMachineUid: null,
      wiringStart: null,
      interactionMode: 'interact', // 'interact' | 'pan'
      scale: 0.85,
      panX: 30,
      panY: 25

    const machinesBoard = document.getElementById('machinesBoard');
    const wiresSvgLayer = document.getElementById('wiresSvgLayer');
    const world = document.getElementById('world');
    const viewport = document.getElementById('viewport');
    const emptyNotice = document.getElementById('emptyNotice');
    const sidebar = document.getElementById('sidebar');
    const btnToggleSidebar = document.getElementById('btnToggleSidebar');
    const btnSidebarClose = document.getElementById('btnSidebarClose');
    const btnFloatingOpen = document.getElementById('btnFloatingOpen');
    const toggleSidebarIcon = document.getElementById('toggleSidebarIcon');

    /* ============================================================
       MODO INTERACTUAR vs MOVER TABLERO (PANEO EN CUALQUIER ZOOM)
       ============================================================ */
    const btnModeInteract = document.getElementById('btnModeInteract');
    const btnModePan = document.getElementById('btnModePan');

    function setMode(mode) {
      appState.interactionMode = mode;
      if (mode === 'pan') {
        document.body.classList.add('pan-mode-active');
        btnModePan.className = 'px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950 flex items-center gap-1.5 transition';
        btnModeInteract.className = 'px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1.5 transition';
        notify('Modo Mover Tablero: Arrastra cualquier parte para desplazarte');
      } else {
        document.body.classList.remove('pan-mode-active');
        btnModeInteract.className = 'px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950 flex items-center gap-1.5 transition';
        btnModePan.className = 'px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1.5 transition';
      }
    }

    btnModeInteract.addEventListener('click', () => setMode('interact'));
    btnModePan.addEventListener('click', () => setMode('pan'));

    /* ============================================================
       SELECTOR DE ESTILO DE CABLE: CURVO vs CUADRADO (90°)
       ============================================================ */
    const btnStyleCurved = document.getElementById('btnStyleCurved');
    const btnStyleOrtho = document.getElementById('btnStyleOrtho');

    function updateWireStyleButtons(style) {
      if (style === 'ortho') {
        btnStyleOrtho.className = 'px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950 flex items-center gap-1 transition';
        btnStyleCurved.className = 'px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 transition';
      } else {
        btnStyleCurved.className = 'px-2.5 py-1 rounded text-xs font-bold bg-amber-500 text-slate-950 flex items-center gap-1 transition';
        btnStyleOrtho.className = 'px-2.5 py-1 rounded text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 transition';
      }
    }

    function setWireStyle(style) {
      appState.currentWireStyle = style;
      updateWireStyleButtons(style);

      // Si hay un cable seleccionado, convertirlo al instante o alternar su orientación de esquina
      if (appState.selectedWireId) {
        const wire = appState.wires.find(w => w.id === appState.selectedWireId);
        if (wire) {
          if (wire.style === 'ortho' && style === 'ortho') {
            wire.orthoVariant = wire.orthoVariant === 'h-first' ? 'v-first' : 'h-first';
            notify('Esquinas cuadradas invertidas • Arrastra el círculo blanco para mover el tramo');
          } else {
            wire.style = style;
            notify(style === 'ortho'
              ? 'Cable convertido a Cuadrado (90°) • Arrastra el nodo blanco para encajarlo'
              : 'Cable convertido a Curvo');
          }
          renderWirePath(wire);
        }
      } else {
        notify(style === 'ortho'
          ? 'Modo Cable Cuadrado (90°) activo'
          : 'Modo Cable Curvo activo');
      }
    }

    btnStyleCurved.addEventListener('click', () => setWireStyle('curved'));
    btnStyleOrtho.addEventListener('click', () => setWireStyle('ortho'));

    /* ============================================================
       COLAPSAR / DESPLEGAR BARRA LATERAL
       ============================================================ */
    function toggleSidebar(forceOpen = null) {
      const willCollapse = forceOpen !== null ? !forceOpen : !sidebar.classList.contains('collapsed');
      if (willCollapse) {
        sidebar.classList.add('collapsed');
        btnFloatingOpen.classList.remove('hidden');
        toggleSidebarIcon.className = 'fa-solid fa-angles-right text-xs';
        document.getElementById('toggleSidebarText').textContent = 'Mostrar Banco';
      } else {
        sidebar.classList.remove('collapsed');
        btnFloatingOpen.classList.add('hidden');
        toggleSidebarIcon.className = 'fa-solid fa-angles-left text-xs';
        document.getElementById('toggleSidebarText').textContent = 'Ocultar Banco';
      }
    }

    btnToggleSidebar.addEventListener('click', () => toggleSidebar());
    btnSidebarClose.addEventListener('click', () => toggleSidebar(false));
    btnFloatingOpen.addEventListener('click', () => toggleSidebar(true));

    /* ============================================================
       TEMAS DE FONDO DEL LIENZO
       ============================================================ */
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => {
          b.className = 'theme-btn px-2 py-0.5 rounded text-[11px] font-semibold text-slate-400 hover:text-white';
        });
        btn.className = 'theme-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-amber-300';

        const theme = btn.dataset.theme;
        viewport.classList.remove('theme-dark', 'theme-white');
        if (theme === 'dark') viewport.classList.add('theme-dark');
        if (theme === 'white') viewport.classList.add('theme-white');
      });
    });

    /* ============================================================
       ZOOM Y PANEO LIBRE (EN GRANDE O PEQUEÑO)
       ============================================================ */
    function updateTransform() {
      world.style.transform = `translate(${appState.panX}px, ${appState.panY}px) scale(${appState.scale})`;
      document.getElementById('zoomLabel').textContent = Math.round(appState.scale * 100) + '%';
    }

    function zoomAroundPoint(newScale, screenX, screenY) {
      const clampedScale = Math.max(0.22, Math.min(2.4, newScale));
      const rect = viewport.getBoundingClientRect();
      const cx = screenX !== undefined ? screenX - rect.left : rect.width / 2;
      const cy = screenY !== undefined ? screenY - rect.top : rect.height / 2;

      appState.panX = cx - ((cx - appState.panX) / appState.scale) * clampedScale;
      appState.panY = cy - ((cy - appState.panY) / appState.scale) * clampedScale;
      appState.scale = clampedScale;
      updateTransform();
    }

    document.getElementById('btnZoomIn').addEventListener('click', () => zoomAroundPoint(appState.scale + 0.14));
    document.getElementById('btnZoomOut').addEventListener('click', () => zoomAroundPoint(appState.scale - 0.14));

    function fitAllMachinesInView() {
      if (appState.machinesOnBoard.length === 0) {
        appState.scale = 0.9;
        appState.panX = 40;
        appState.panY = 40;
        updateTransform();
        return;
      }
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      appState.machinesOnBoard.forEach(m => {
        const tmpl = MACHINE_TEMPLATES.find(t => t.id === m.templateId);
        minX = Math.min(minX, m.x);
        minY = Math.min(minY, m.y);
        maxX = Math.max(maxX, m.x + tmpl.width);
        maxY = Math.max(maxY, m.y + tmpl.height);
      });
      const rect = viewport.getBoundingClientRect();
      const contentW = Math.max(400, maxX - minX + 120);
      const contentH = Math.max(300, maxY - minY + 120);
      const scale = Math.min(1.15, Math.max(0.25, Math.min(rect.width / contentW, rect.height / contentH)));
      appState.scale = scale;
      appState.panX = (rect.width - (maxX - minX) * scale) / 2 - minX * scale;
      appState.panY = (rect.height - (maxY - minY) * scale) / 2 - minY * scale;
      updateTransform();
    }

    document.getElementById('btnZoomReset').addEventListener('click', fitAllMachinesInView);
    document.getElementById('panCenter').addEventListener('click', fitAllMachinesInView);

    // Botones del D-Pad direccional en pantalla
    document.getElementById('panUp').addEventListener('click', () => { appState.panY += 140; updateTransform(); });
    document.getElementById('panDown').addEventListener('click', () => { appState.panY -= 140; updateTransform(); });
    document.getElementById('panLeft').addEventListener('click', () => { appState.panX += 140; updateTransform(); });
    document.getElementById('panRight').addEventListener('click', () => { appState.panX -= 140; updateTransform(); });

    // Arrastre directo del tablero con clic izquierdo en cualquier espacio vacío, modo Mover Tablero, clic central o clic derecho
    let isPanningBoard = false;
    let panOriginX = 0;
    let panOriginY = 0;

    viewport.addEventListener('pointerdown', (e) => {
      const clickedEmptyArea = (
        e.target.id === 'viewport' ||
        e.target.id === 'world' ||
        e.target.id === 'machinesBoard' ||
        e.target.id === 'wiresSvgLayer'
      );

      if (appState.interactionMode === 'pan' || e.button === 1 || e.button === 2 || (e.button === 0 && clickedEmptyArea)) {
        if (appState.wiringStart && clickedEmptyArea) {
          abortWiring();
        }
        deselectWire();
        deselectMachine();
        isPanningBoard = true;
        panOriginX = e.clientX - appState.panX;
        panOriginY = e.clientY - appState.panY;
        viewport.style.cursor = 'grabbing';
        viewport.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });

    viewport.addEventListener('pointermove', (e) => {
      if (isPanningBoard) {
        appState.panX = e.clientX - panOriginX;
        appState.panY = e.clientY - panOriginY;
        updateTransform();
        return;
      }

      if (appState.wiringStart && tempDraftWire) {
        const rect = world.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / appState.scale;
        const mouseY = (e.clientY - rect.top) / appState.scale;
        const p1 = { x: appState.wiringStart.x, y: appState.wiringStart.y };
        const p2 = { x: mouseX, y: mouseY };
        tempDraftWire.setAttribute(
          'd',
          generateWirePathData(p1, p2, { x: 0, y: 45 }, appState.currentWireStyle, 'v-first')
        );
      }
    });

    const stopBoardPan = (e) => {
      if (isPanningBoard) {
        isPanningBoard = false;
        viewport.style.cursor = 'grab';
        try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
      }
    };
    viewport.addEventListener('pointerup', stopBoardPan);
    viewport.addEventListener('pointercancel', stopBoardPan);

    // Zoom centrado en el puntero con la rueda del ratón
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      zoomAroundPoint(appState.scale + delta, e.clientX, e.clientY);
    }, { passive: false });

    viewport.addEventListener('contextmenu', e => e.preventDefault());

    /* ============================================================
       CATÁLOGO Y CREACIÓN DE MÁQUINAS
       ============================================================ */
    function renderCatalog(filterText = '') {
      const catalogEl = document.getElementById('machinesCatalog');
      catalogEl.innerHTML = '';

      const filtered = MACHINE_TEMPLATES.filter(tmpl =>
        tmpl.name.toLowerCase().includes(filterText.toLowerCase()) ||
        tmpl.category.toLowerCase().includes(filterText.toLowerCase())
      );

      filtered.forEach(tmpl => {
        const card = document.createElement('div');
        card.className = 'p-2.5 bg-slate-950 border border-slate-800 hover:border-amber-500/80 rounded-xl cursor-pointer transition shadow group';
        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="text-xs font-bold text-slate-100 group-hover:text-amber-400 transition truncate">${tmpl.name}</div>
              <div class="text-[10px] text-slate-400 mt-0.5 truncate">${tmpl.category}</div>
            </div>
            <button class="shrink-0 bg-slate-800 group-hover:bg-amber-500 group-hover:text-slate-950 text-slate-200 px-2.5 py-1 rounded-lg text-[11px] font-bold transition">
              + Agregar
            </button>
          </div>
        `;

        card.addEventListener('click', () => {
          // Colocar cerca del centro visible actual del tablero
          const rect = viewport.getBoundingClientRect();
          const centerWorldX = ((rect.width / 2) - appState.panX) / appState.scale;
          const centerWorldY = ((rect.height / 2) - appState.panY) / appState.scale;
          const posX = Math.max(20, Math.round(centerWorldX - tmpl.width / 2 + (Math.random() * 50 - 25)));
          const posY = Math.max(20, Math.round(centerWorldY - tmpl.height / 2 + (Math.random() * 50 - 25)));
          spawnMachine(tmpl.id, posX, posY);
        });

        catalogEl.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => renderCatalog(e.target.value));

    let machineCounter = 1;

    function spawnMachine(templateId, initialX = 50, initialY = 50) {
      const tmpl = MACHINE_TEMPLATES.find(t => t.id === templateId);
      if (!tmpl) return;

      const uid = 'mach_' + (machineCounter++);

      const machineEl = document.createElement('div');
      machineEl.className = 'lab-machine';
      machineEl.id = uid;
      machineEl.style.width = tmpl.width + 'px';
      machineEl.style.height = tmpl.height + 'px';
      machineEl.style.left = initialX + 'px';
      machineEl.style.top = initialY + 'px';

      const svgContainer = document.createElement('div');
      svgContainer.className = 'w-full h-full pointer-events-none';
      svgContainer.innerHTML = `<svg width="100%" height="100%">${tmpl.svgContent}</svg>`;
      machineEl.appendChild(svgContainer);

      tmpl.terminals.forEach(term => {
        const jack = document.createElement('div');
        jack.className = 'banana-jack';
        jack.style.left = term.x + 'px';
        jack.style.top = term.y + 'px';
        jack.style.backgroundColor = term.color;
        jack.title = `${term.label} (${tmpl.name})`;
        jack.dataset.machineUid = uid;
        jack.dataset.terminalId = term.id;

        jack.addEventListener('pointerdown', (e) => {
          if (appState.interactionMode === 'pan') return;
          e.stopPropagation();
          onTerminalPointerDown(uid, term.id);
        });

        machineEl.appendChild(jack);
      });

      enableDraggable(machineEl, uid);

      machineEl.addEventListener('pointerdown', (e) => {
        if (appState.interactionMode === 'pan') return;
        if (e.target.classList.contains('banana-jack')) return;
        e.stopPropagation();
        selectMachine(uid);
      });

      machinesBoard.appendChild(machineEl);

      appState.machinesOnBoard.push({
        uid,
        templateId,
        x: initialX,
        y: initialY,
        el: machineEl
      });

      refreshEmptyNotice();
      return uid;
    }

    function selectMachine(uid) {
      appState.selectedMachineUid = uid;
      deselectWire();
      document.querySelectorAll('.lab-machine').forEach(m => {
        m.classList.toggle('active-selected', m.id === uid);
      });
    }

    function deselectMachine() {
      appState.selectedMachineUid = null;
      document.querySelectorAll('.lab-machine').forEach(m => m.classList.remove('active-selected'));
    }

    function refreshEmptyNotice() {
      emptyNotice.classList.toggle('hidden', appState.machinesOnBoard.length > 0);
    }

    /* ============================================================
       ARRASTRE DE MÁQUINAS Y ACTUALIZACIÓN DE CABLES
       ============================================================ */
    function enableDraggable(element, uid) {
      let isDragging = false;
      let startClientX, startClientY;
      let startLeft, startTop;

      element.addEventListener('pointerdown', (e) => {
        if (appState.interactionMode === 'pan') return;
        if (e.target.classList.contains('banana-jack') || e.button !== 0) return;
        e.stopPropagation();
        isDragging = true;
        startClientX = e.clientX;
        startClientY = e.clientY;
        startLeft = parseFloat(element.style.left) || 0;
        startTop = parseFloat(element.style.top) || 0;
        element.setPointerCapture(e.pointerId);
      });

      element.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = (e.clientX - startClientX) / appState.scale;
        const dy = (e.clientY - startClientY) / appState.scale;

        const newX = Math.max(10, startLeft + dx);
        const newY = Math.max(10, startTop + dy);

        element.style.left = newX + 'px';
        element.style.top = newY + 'px';

        const mach = appState.machinesOnBoard.find(m => m.uid === uid);
        if (mach) {
          mach.x = newX;
          mach.y = newY;
        }

        redrawAllWires();
      });

      const onStopDrag = (e) => {
        if (isDragging) {
          isDragging = false;
          try { element.releasePointerCapture(e.pointerId); } catch (err) {}
        }
      };

      element.addEventListener('pointerup', onStopDrag);
      element.addEventListener('pointercancel', onStopDrag);
    }

    /* ============================================================
       SISTEMA DE CABLEADO Y RODADO DE CABLES
       ============================================================ */
    let tempDraftWire = null;

    function getAbsoluteTerminalCoords(machineUid, termId) {
      const mach = appState.machinesOnBoard.find(m => m.uid === machineUid);
      if (!mach) return { x: 0, y: 0 };
      const tmpl = MACHINE_TEMPLATES.find(t => t.id === mach.templateId);
      const term = tmpl.terminals.find(t => t.id === termId);
      if (!term) return { x: 0, y: 0 };
      return { x: mach.x + term.x, y: mach.y + term.y };
    }

    function onTerminalPointerDown(machineUid, termId) {
      const pos = getAbsoluteTerminalCoords(machineUid, termId);

      if (!appState.wiringStart) {
        appState.wiringStart = { machineUid, termId, x: pos.x, y: pos.y };

        tempDraftWire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tempDraftWire.setAttribute('fill', 'none');
        tempDraftWire.setAttribute('stroke', appState.currentColor);
        tempDraftWire.setAttribute('stroke-width', '5.5');
        tempDraftWire.setAttribute('stroke-linecap', 'round');
        tempDraftWire.setAttribute('stroke-linejoin', 'round');
        tempDraftWire.setAttribute('stroke-dasharray', '8,6');
        wiresSvgLayer.appendChild(tempDraftWire);

        notify('Haz clic en otro borne para completar la conexión');
      } else {
        if (appState.wiringStart.machineUid === machineUid && appState.wiringStart.termId === termId) {
          abortWiring();
          return;
        }
        addWire(
          appState.wiringStart.machineUid,
          appState.wiringStart.termId,
          machineUid,
          termId,
          appState.currentColor,
          appState.currentWireStyle
        );
        abortWiring();
        notify('Cable conectado • Arrastra su círculo blanco central para moverlo');
      }
    }

    function abortWiring() {
      if (tempDraftWire && tempDraftWire.parentNode) {
        tempDraftWire.parentNode.removeChild(tempDraftWire);
      }
      tempDraftWire = null;
      appState.wiringStart = null;
    }

    // Genera ruta curva (Bézier) o cuadrada ortogonal a 90° que pasa siempre por el manejador (midX, midY)
    function generateWirePathData(p1, p2, offset, style = 'curved', orthoVariant = 'v-first') {
      const midX = (p1.x + p2.x) / 2 + (offset.x || 0);
      const midY = (p1.y + p2.y) / 2 + (offset.y !== undefined ? offset.y : 40);

      if (style === 'ortho') {
        if (orthoVariant === 'h-first') {
          // Sale horizontal de ambos bornes hacia la columna vertical en midX y cruza por midY
          const stepOut = (p2.x >= p1.x) ? 24 : -24;
          const xStart = Math.abs(midX - p1.x) > 18 ? midX : p1.x + stepOut;
          return `M ${p1.x} ${p1.y} L ${xStart} ${p1.y} L ${xStart} ${midY} L ${midX} ${midY} L ${midX} ${p2.y} L ${p2.x} ${p2.y}`;
        } else {
          // Sale hacia el canal horizontal en midY pudiendo además estirar el costado hacia midX (ideal para pasar por debajo o rodear máquinas como en tu foto)
          const minX = Math.min(p1.x, p2.x);
          const maxX = Math.max(p1.x, p2.x);
          if (midX < minX - 18 || midX > maxX + 18) {
            // Si el usuario arrastra el nodo blanco hacia la izquierda o derecha de ambos bornes, hace un puente lateral cuadrado
            const leg1Y = p1.y + (midY >= p1.y ? 22 : -22);
            return `M ${p1.x} ${p1.y} L ${p1.x} ${leg1Y} L ${midX} ${leg1Y} L ${midX} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;
          }
          // Canal inferior/superior cuadrado directo pasando exactamente por (midX, midY)
          return `M ${p1.x} ${p1.y} L ${p1.x} ${midY} L ${midX} ${midY} L ${p2.x} ${midY} L ${p2.x} ${p2.y}`;
        }
      }

      // Curva suave por defecto
      const ctrlX = 2 * midX - 0.5 * (p1.x + p2.x);
      const ctrlY = 2 * midY - 0.5 * (p1.y + p2.y);
      return `M ${p1.x} ${p1.y} Q ${ctrlX} ${ctrlY} ${p2.x} ${p2.y}`;
    }

    function addWire(fromUid, fromTermId, toUid, toTermId, color, style = appState.currentWireStyle) {
      const wireId = 'wire_' + Date.now() + Math.random().toString(16).slice(2, 6);

      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.id = wireId;
      group.classList.add('pointer-events-auto');

      const shadowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      shadowPath.setAttribute('fill', 'none');
      shadowPath.setAttribute('stroke', 'rgba(2, 6, 23, 0.45)');
      shadowPath.setAttribute('stroke-width', '8');
      shadowPath.setAttribute('stroke-linecap', 'round');
      shadowPath.setAttribute('stroke-linejoin', 'round');

      const mainPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      mainPath.setAttribute('fill', 'none');
      mainPath.setAttribute('stroke', color);
      mainPath.setAttribute('stroke-width', '5.5');
      mainPath.setAttribute('stroke-linecap', 'round');
      mainPath.setAttribute('stroke-linejoin', 'round');

      const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hitPath.setAttribute('fill', 'none');
      hitPath.setAttribute('stroke', 'transparent');
      hitPath.setAttribute('stroke-width', '20');
      hitPath.setAttribute('stroke-linejoin', 'round');
      hitPath.style.cursor = 'pointer';

      const handleCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      handleCircle.classList.add('wire-handle');
      handleCircle.setAttribute('r', '7.5');

      group.appendChild(shadowPath);
      group.appendChild(mainPath);
      group.appendChild(hitPath);
      group.appendChild(handleCircle);
      wiresSvgLayer.appendChild(group);

      const wireObj = {
        id: wireId,
        fromUid,
        fromTermId,
        toUid,
        toTermId,
        color,
        style: style || 'curved',
        orthoVariant: 'v-first',
        customOffset: { x: 0, y: 45 },
        element: group,
        mainPath,
        shadowPath,
        hitPath,
        handleCircle
      };

      hitPath.addEventListener('pointerdown', (e) => {
        if (appState.interactionMode === 'pan') return;
        e.stopPropagation();
        selectWire(wireId);
      });

      // Doble clic sobre cualquier cable alterna entre Curvo, Cuadrado Vertical y Cuadrado Horizontal
      hitPath.addEventListener('dblclick', (e) => {
        if (appState.interactionMode === 'pan') return;
        e.stopPropagation();
        if (wireObj.style === 'curved') {
          wireObj.style = 'ortho';
          wireObj.orthoVariant = 'v-first';
          notify('Cable cambiado a Cuadrado (90°)');
        } else if (wireObj.style === 'ortho' && wireObj.orthoVariant === 'v-first') {
          wireObj.orthoVariant = 'h-first';
          notify('Esquinas cuadradas giradas');
        } else {
          wireObj.style = 'curved';
          notify('Cable cambiado a Curvo');
        }
        updateWireStyleButtons(wireObj.style);
        renderWirePath(wireObj);
      });

      enableWireHandleDrag(handleCircle, wireObj);

      appState.wires.push(wireObj);
      renderWirePath(wireObj);
      return wireObj;
    }

    function enableWireHandleDrag(handleEl, wireObj) {
      let isDragging = false;
      let startMouseX, startMouseY;
      let initialOffsetX, initialOffsetY;

      handleEl.addEventListener('pointerdown', (e) => {
        if (appState.interactionMode === 'pan' || e.button !== 0) return;
        e.stopPropagation();
        isDragging = true;
        selectWire(wireObj.id);
        startMouseX = e.clientX;
        startMouseY = e.clientY;
        initialOffsetX = wireObj.customOffset.x;
        initialOffsetY = wireObj.customOffset.y;
        handleEl.setPointerCapture(e.pointerId);
      });

      handleEl.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = (e.clientX - startMouseX) / appState.scale;
        const dy = (e.clientY - startMouseY) / appState.scale;

        wireObj.customOffset.x = initialOffsetX + dx;
        wireObj.customOffset.y = initialOffsetY + dy;
        renderWirePath(wireObj);
      });

      const onStop = (e) => {
        if (isDragging) {
          isDragging = false;
          try { handleEl.releasePointerCapture(e.pointerId); } catch (err) {}
        }
      };

      handleEl.addEventListener('pointerup', onStop);
      handleEl.addEventListener('pointercancel', onStop);
    }

    function renderWirePath(wire) {
      const p1 = getAbsoluteTerminalCoords(wire.fromUid, wire.fromTermId);
      const p2 = getAbsoluteTerminalCoords(wire.toUid, wire.toTermId);

      const d = generateWirePathData(p1, p2, wire.customOffset, wire.style, wire.orthoVariant);
      wire.mainPath.setAttribute('d', d);
      wire.hitPath.setAttribute('d', d);

      const p1Shadow = { x: p1.x, y: p1.y + 5 };
      const p2Shadow = { x: p2.x, y: p2.y + 5 };
      wire.shadowPath.setAttribute('d', generateWirePathData(p1Shadow, p2Shadow, wire.customOffset, wire.style, wire.orthoVariant));

      const midX = (p1.x + p2.x) / 2 + wire.customOffset.x;
      const midY = (p1.y + p2.y) / 2 + wire.customOffset.y;
      wire.handleCircle.setAttribute('cx', midX);
      wire.handleCircle.setAttribute('cy', midY);
    }

    function redrawAllWires() {
      appState.wires.forEach(wire => renderWirePath(wire));
    }

    /* ============================================================
       SELECCIÓN, COLOR Y ELIMINACIÓN
       ============================================================ */
    function selectWire(wireId) {
      appState.selectedWireId = wireId;
      deselectMachine();
      appState.wires.forEach(w => {
        if (w.id === wireId) {
          w.mainPath.setAttribute('stroke-width', '8');
          w.handleCircle.setAttribute('r', '9.5');
          w.handleCircle.style.stroke = '#f59e0b';
          updateWireStyleButtons(w.style || 'curved');
        } else {
          w.mainPath.setAttribute('stroke-width', '5.5');
          w.handleCircle.setAttribute('r', '7.5');
          w.handleCircle.style.stroke = '#0f172a';
        }
      });
    }

    function deselectWire() {
      if (appState.selectedWireId) {
        appState.wires.forEach(w => {
          w.mainPath.setAttribute('stroke-width', '5.5');
          w.handleCircle.setAttribute('r', '7.5');
          w.handleCircle.style.stroke = '#0f172a';
        });
        appState.selectedWireId = null;
      }
    }

    function deleteActiveSelection() {
      if (appState.selectedWireId) {
        const idx = appState.wires.findIndex(w => w.id === appState.selectedWireId);
        if (idx !== -1) {
          const wire = appState.wires[idx];
          if (wire.element.parentNode) wire.element.parentNode.removeChild(wire.element);
          appState.wires.splice(idx, 1);
          appState.selectedWireId = null;
          notify('Cable eliminado');
          return;
        }
      }

      if (appState.selectedMachineUid) {
        const machIdx = appState.machinesOnBoard.findIndex(m => m.uid === appState.selectedMachineUid);
        if (machIdx !== -1) {
          const mach = appState.machinesOnBoard[machIdx];
          const remainingWires = [];
          appState.wires.forEach(wire => {
            if (wire.fromUid === mach.uid || wire.toUid === mach.uid) {
              if (wire.element.parentNode) wire.element.parentNode.removeChild(wire.element);
            } else {
              remainingWires.push(wire);
            }
          });
          appState.wires = remainingWires;

          if (mach.el.parentNode) mach.el.parentNode.removeChild(mach.el);
          appState.machinesOnBoard.splice(machIdx, 1);
          appState.selectedMachineUid = null;
          refreshEmptyNotice();
          notify('Máquina eliminada');
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'Delete' || e.key === 'Backspace') deleteActiveSelection();
      if (e.key === 'Escape') {
        abortWiring();
        deselectWire();
        deselectMachine();
      }
    });

    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => {
          b.classList.remove('ring-2', 'border-white');
          b.classList.add('border-transparent');
        });
        btn.classList.add('ring-2', 'border-white');
        appState.currentColor = btn.dataset.color;

        if (appState.selectedWireId) {
          const wire = appState.wires.find(w => w.id === appState.selectedWireId);
          if (wire) {
            wire.color = appState.currentColor;
            wire.mainPath.setAttribute('stroke', wire.color);
          }
        }
      });
    });

    document.getElementById('btnDeleteSelected').addEventListener('click', deleteActiveSelection);

    document.getElementById('btnClearWires').addEventListener('click', () => {
      appState.wires.forEach(w => {
        if (w.element.parentNode) w.element.parentNode.removeChild(w.element);
      });
      appState.wires = [];
      appState.selectedWireId = null;
      notify('Todos los cables retirados');
    });

    document.getElementById('btnClearAll').addEventListener('click', () => {
      appState.wires.forEach(w => {
        if (w.element.parentNode) w.element.parentNode.removeChild(w.element);
      });
      appState.wires = [];
      appState.machinesOnBoard.forEach(m => {
        if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
      });
      appState.machinesOnBoard = [];
      appState.selectedWireId = null;
      appState.selectedMachineUid = null;
      abortWiring();
      refreshEmptyNotice();
      notify('Tablero limpio');
    });

    /* ============================================================
       EXPORTACIÓN A PNG DE ALTA RESOLUCIÓN
       ============================================================ */
    document.getElementById('btnExport').addEventListener('click', () => {
      if (appState.machinesOnBoard.length === 0) {
        notify('Agrega máquinas antes de exportar');
        return;
      }

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      appState.machinesOnBoard.forEach(m => {
        const tmpl = MACHINE_TEMPLATES.find(t => t.id === m.templateId);
        minX = Math.min(minX, m.x);
        minY = Math.min(minY, m.y);
        maxX = Math.max(maxX, m.x + tmpl.width);
        maxY = Math.max(maxY, m.y + tmpl.height);
      });

      const pad = 70;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      const width = (maxX - minX) + pad * 2;
      const height = (maxY - minY) + pad * 2;

      const canvas = document.createElement('canvas');
      const scale = 2;
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      ctx.fillStyle = viewport.classList.contains('theme-dark') ? '#0b1120' : '#ffffff';
      ctx.fillRect(0, 0, width, height);

      const renderPromises = appState.machinesOnBoard.map(mach => {
        return new Promise((resolve) => {
          const tmpl = MACHINE_TEMPLATES.find(t => t.id === mach.templateId);
          const svgCode = `<svg xmlns="http://www.w3.org/2000/svg" width="${tmpl.width}" height="${tmpl.height}">${tmpl.svgContent}</svg>`;
          const img = new Image();
          const blob = new Blob([svgCode], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          img.onload = () => {
            ctx.drawImage(img, mach.x - minX, mach.y - minY, tmpl.width, tmpl.height);
            tmpl.terminals.forEach(term => {
              ctx.beginPath();
              ctx.arc(mach.x + term.x - minX, mach.y + term.y - minY, 8.5, 0, Math.PI * 2);
              ctx.fillStyle = term.color;
              ctx.fill();
              ctx.strokeStyle = '#0f172a';
              ctx.lineWidth = 2.5;
              ctx.stroke();
            });
            URL.revokeObjectURL(url);
            resolve();
          };
          img.src = url;
        });
      });

      Promise.all(renderPromises).then(() => {
        appState.wires.forEach(wire => {
          const p1Raw = getAbsoluteTerminalCoords(wire.fromUid, wire.fromTermId);
          const p2Raw = getAbsoluteTerminalCoords(wire.toUid, wire.toTermId);
          const p1 = { x: p1Raw.x - minX, y: p1Raw.y - minY };
          const p2 = { x: p2Raw.x - minX, y: p2Raw.y - minY };
          const pathStr = generateWirePathData(p1, p2, wire.customOffset, wire.style, wire.orthoVariant);
          const path2d = new Path2D(pathStr);

          ctx.strokeStyle = wire.color;
          ctx.lineWidth = 5.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke(path2d);
        });

        const link = document.createElement('a');
        link.download = 'conexiones-laboratorio-electrico.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        notify('Imagen PNG descargada');
      });
    });

    let toastTimeout;
    function notify(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2600);
    }

    /* ============================================================
       CARGA INICIAL DEMOSTRATIVA CON EL NUEVO DL 1080 TRIFÁSICO
       ============================================================ */
    window.onload = function() {
      renderCatalog();

      const mTrafoTri = spawnMachine('dl1080_tri', 680, 30);
      const mSyncGrey = spawnMachine('sync_box_grey', 30, 300);
      const mWatt = spawnMachine('wattmeter', 490, 320);

      setTimeout(() => {
        // Conexión trifásica de ejemplo hacia el primario del DL 1080 (1U1, 1V1, 1W1)
        const w1 = addWire(mFuente, 'mains_l1', mTrafoTri, '1u1', '#dc2626');
        const w2 = addWire(mFuente, 'mains_l2', mTrafoTri, '1v1', '#f59e0b');
        const w3 = addWire(mFuente, 'mains_l3', mTrafoTri, '1w1', '#2563eb');
        // Puente estrella en 1U2 - 1V2 - 1W2
        addWire(mTrafoTri, '1u2', mTrafoTri, '1v2', '#0f172a');
        addWire(mTrafoTri, '1v2', mTrafoTri, '1w2', '#0f172a');

        if (w1) { w1.customOffset = { x: 0, y: -55 }; renderWirePath(w1); }
        if (w2) { w2.customOffset = { x: 0, y: -35 }; renderWirePath(w2); }
        if (w3) { w3.customOffset = { x: 0, y: -15 }; renderWirePath(w3); }

        notify('DL 1080 Trifásico exacto cargado • Arrastra el fondo para moverte por el tablero');
      }, 250);
    };
  </script>
